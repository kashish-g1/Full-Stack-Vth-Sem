<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
</head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f2f3f5;
        }

        .container {
            display: grid;
            height:500px;
            width: 500px;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: calc(var(--size)/2);
            outline: 1px dashed rgb(89, 38, 242);
            color:white;
            border-radius: 20%;
        }

        #parent {
            display: grid;
            background-color: rgb(78, 2, 78);
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-row: 1/ 3;
            grid-column: 1 / 3;
            border-radius: 30% 0 0 0;
        }

        #child {

            background-color: rgb(245, 174, 245);
            grid-column: 1 / 2;
            border-radius: 30% 0 0 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="parent">
            <div id="child">
                Hello
            </div>
           
        </div>
    </div>
</body>

</html>
