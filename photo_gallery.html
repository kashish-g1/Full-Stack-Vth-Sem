<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display:grid;
        height:500px;
        width:500px;
        grid-template-areas:
        "box1 box2 box3"
        "box1 box4 box6"
        "box5 box5 box6";
        outline:1px dashed black;
        gap:10px;
       
    }
    .container > div{
        outline:1px solid black;
        box-shadow: 0 0 5px grey;
    }
    #box1{
        grid-column-start:1;
        grid-column-end:3;
        grid-row-start:1;
        grid-row-end:3;
    }
</style>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
    </div>
</body>
</html>
