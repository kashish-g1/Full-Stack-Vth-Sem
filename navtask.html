<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        .container{
            display:flex;
            flex-direction:row;
            justify-content:space-between;
            margin:1% 1% 0 1%;
            background:#0b316d;
            color:white;
            border-radius:5px;
            box-shadow:0 0 12px  grey;
        }
        .logo{
            flex:1;
            display:flex;
            align-items:center;
            padding-left:1%;
        }
        .nav-ul{
            display:flex;
            flex:1;
            column-gap:10%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">LOGO</div>
        <ul class="nav-ul">
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
    </div>
</body>
</html>
