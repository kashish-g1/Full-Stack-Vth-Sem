<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        
        width:90vw;
        height:90vh;
        outline:2px solid black;
        display:flex;
        flex-direction: row; 
       
    }

    .container>div{
        color:white;
        height:100px;

    }

    #box1{
        background-color:green;
        flex-basis: 100px;
        flex-grow: 1;
    }
    #box2{
        background-color:blue;
        flex-basis: 100px;
        flex-grow: 1;
    }
    #box3{
        background-color:orange;
        flex-basis: 100px;
        flex-grow: 1;
    }
    #box4{
        background-color:purple;
        flex-basis: 100px;
        flex-grow: 1;
    }
    #box5{
        background-color:yellow;
        flex-basis: 100px;
        flex-grow: 1;
    }

</style>


<body>
    <div class="container">
        <div id="box1"> 1</div>
        <div id="box2"> 2</div>
        <div id="box3"> 3</div>
        <div id="box4"> 4</div>
        <div id="box5"> 5</div>
    </div>
</body>
</html>
</body>
</html>
