<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*
            :enabled
            :disabled
            :valid
            :invalid
            :required
            :optional
            :in-range
            :out-of-range
            :placeholder-shown
            :checked
            :read-only
            :read-write
        */
        input{
            margin: 3px;
            border-width:0 0 2px 0;
            border-color:blue;
        }    
        input:required{
            font-family: Arial;
        }
        input:optional{
            font-family:Montana;
            font-style:italic;
        }
        input:valid{
            background-color:green;
        }
        input:invalid{
            background-color:red;
        }
        input:in-range{
            font-weight:900;
        }
        input:out-of-range{
            font-size:30px;
        }
        input:disabled{
            border-width:0px;
            background-color:grey;
            color:white;
        }
        input:enabled{
            color:black;
            background-color:lightslategrey;
        }
        input:checked{
            box-shadow: 3px 3px 0px black;
        }
        input:placeholder-shown{
            font-size:20px;
        }
        input:read-only{
            background-color:transparent;
            border-width:0px;
        }
        input:read-write{
            box-shadow:3px 3px 0px black;
        }
    </style>
</head>
<body>
    <form>
        <input type="text" placeholder="First name" required><br/><br/>
        <input type="text" placeholder="Middle name" ><br/><br/>
        <input type="text" placeholder="Last name" required><br/><br/>
        <input type="email" placeholder="Email" ><br/><br/>
        <input type="number" placeholder="Age" min="18" max="150"><br/><br/>
        <input type="text" value="MATHURA" disabled><br/><br/>
        <input type="checkbox" checked> I agree to the terms and conditions<br/><br/>
        <input type="text" placeholder="Enter your name" readonly><br/><br/>
    </form>
</body>
</html>
