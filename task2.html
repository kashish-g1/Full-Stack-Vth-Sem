
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navigation Bar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background-color: #333;
      color: white;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
    }

    .menu-button {
      display: none;
      font-size: 24px;
      background: none;
      color: white;
      border: none;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .menu-button {
        display: block;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        flex-direction: column;
        gap: 0;
        background-color: #333;
      }

      .nav-links.show {
        display: flex;
      }

      .nav-links li {
        padding: 15px 25px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">My Website</div>

    <button class="menu-button" onclick="toggleMenu()">☰</button>

    <ul class="nav-links" id="navLinks">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</body>
</html>
