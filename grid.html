<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Grid Layout</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f3f3f3;
            font-family: Arial, sans-serif;
        }

        .gallery {
            width: min(760px, 90vw);
            display: grid;
            grid-template-columns: repeat(2, minmax(180px, 1fr));
            gap: 18px;
        }

        .item {
            overflow: hidden;
            border-radius: 14px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.12);
            background: #ddd;
        }

        .item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .row-wide {
            grid-column: 1 / -1;
            height: 220px;
        }

        .row-half {
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <div class="item row-wide">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80" alt="Landscape 1">
        </div>

        <div class="item row-half">
            <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80" alt="Landscape 2">
        </div>

        <div class="item row-half">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Landscape 3">
        </div>

        <div class="item row-wide">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80" alt="Landscape 4">
        </div>
    </div>
</body>
</html>
