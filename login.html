<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
     

      body {
        margin: 0;
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-card {
        background: #f1eff3;
        padding: 24px;
        border: 1px solid #1a1919;
        border-radius: 10px;
        width: 100%;
        max-width: 320px;
      }

    </style>
  </head>
  <body>
    <div class="login-card">
      <h2>Login</h2>
      <form>
        <div class="input-group">
          <input type="email" placeholder="Email" required />
          <br>
        </div>
        <div class="input-group">
          <input type="password" placeholder="Password" required />
        </div>
        <button type="submit">Sign In</button>
      </form>
    </div>
  </body>
</html>
